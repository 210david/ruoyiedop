<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDOP 角色化工作台 · 原型 v0.1</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --line:#e5e8ec; --line-strong:#d3d8de;
    --text:#1c2431; --text2:#5b6675; --text3:#8a94a3;
    --primary:#1b5faa; --primary-bg:#eaf2fb; --primary-line:#bcd5ee;
    --ok:#157f4a; --ok-bg:#e8f5ee; --danger:#b52f2f; --danger-bg:#fbeceb;
    --warn:#a86a10; --warn-bg:#fdf3e2;
    --radius:8px; --radius-lg:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:13px; line-height:1.6;
    height:100vh; overflow:hidden;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  .app{height:100vh;display:flex;flex-direction:column;}

  /* ---------- top bar ---------- */
  .topbar{
    height:54px;flex:0 0 54px;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:16px;padding:0 18px;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;letter-spacing:.3px;}
  .brand-mark{width:22px;height:22px;border-radius:6px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;}
  .crumb{color:var(--text3);font-size:12px;}
  .crumb b{color:var(--text2);font-weight:500;}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}

  .role-switch{display:flex;background:#eef1f4;border-radius:20px;padding:3px;gap:2px;}
  .role-switch button{
    padding:5px 12px;border-radius:16px;font-size:12px;color:var(--text2);transition:.15s;
  }
  .role-switch button.on{background:#fff;color:var(--primary);font-weight:500;box-shadow:0 1px 2px rgba(16,30,54,.1);}

  .mode-btn{
    padding:6px 12px;border:1px solid var(--line-strong);border-radius:6px;font-size:12px;color:var(--text2);
    display:flex;align-items:center;gap:6px;background:#fff;
  }
  .mode-btn:hover{border-color:var(--primary-line);color:var(--primary);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);}
  .dot.gray{background:var(--text3);}

  .icon-btn{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2);}
  .icon-btn:hover{background:#f0f2f5;}

  .user-chip{display:flex;align-items:center;gap:8px;padding-left:12px;margin-left:2px;border-left:1px solid var(--line);}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--primary-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;}
  .user-name{font-size:12px;font-weight:500;}
  .user-dept{font-size:11px;color:var(--text3);}

  /* 原型演示控件：不属于产品界面 */
  .demo-bar{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    background:#22303f;border-radius:24px;padding:6px 8px 6px 12px;
    display:flex;align-items:center;gap:10px;z-index:30;
    box-shadow:0 6px 24px rgba(16,30,54,.28);font-size:12px;white-space:nowrap;
  }
  .demo-tag{background:#3b4d5f;color:#9fb2c6;font-size:10px;padding:2px 7px;border-radius:10px;letter-spacing:.5px;}
  .demo-label{color:#7f8fa2;font-size:11px;}
  .demo-sep{width:1px;height:14px;background:#3f5468;}
  .demo-bar .role-switch{background:#2f4152;border-radius:20px;padding:2px;}
  .demo-bar .role-switch button{color:#9fb2c6;font-size:11px;padding:4px 10px;}
  .demo-bar .role-switch button.on{background:#53a3e8;color:#fff;box-shadow:none;font-weight:500;}
  .demo-bar .mode-btn{background:transparent;border-color:#3f5468;color:#c8d2de;font-size:11px;padding:4px 10px;border-radius:6px;}
  .demo-bar .mode-btn:hover{border-color:#53a3e8;color:#fff;}

  /* ---------- body ---------- */
  .body{flex:1;display:flex;min-height:0;}

  .sidebar{
    width:212px;flex:0 0 212px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:12px 0;overflow-y:auto;transition:.2s;
  }
  .sidebar.collapsed{width:60px;flex:0 0 60px;}
  .sidebar.collapsed .nav-text,.sidebar.collapsed .nav-group{display:none;}
  .nav-group{padding:12px 16px 6px;font-size:11px;color:var(--text3);letter-spacing:.5px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 16px;color:var(--text2);font-size:13px;
    border-left:2px solid transparent;white-space:nowrap;
  }
  .sidebar.collapsed .nav-item{justify-content:center;padding:10px 0;}
  .nav-item:hover{background:#f7f9fb;color:var(--text);}
  .nav-item.on{background:var(--primary-bg);color:var(--primary);border-left-color:var(--primary);font-weight:500;}
  .nav-item.locked{color:#b8c0ca;}
  .nav-ico{width:16px;height:16px;flex:0 0 16px;border-radius:4px;background:currentColor;opacity:.28;}
  .nav-item.on .nav-ico{opacity:.9;}
  .nav-badge{margin-left:auto;background:var(--danger-bg);color:var(--danger);font-size:11px;padding:0 6px;border-radius:9px;font-weight:500;}
  .nav-more{margin-top:auto;padding:10px 16px;border-top:1px solid var(--line);color:var(--primary);font-size:12px;}

  /* ---------- main ---------- */
  .content{flex:1;overflow-y:auto;padding:20px 24px 40px;}

  .greet{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;}
  .greet h1{font-size:19px;font-weight:600;letter-spacing:.2px;}
  .greet p{font-size:12px;color:var(--text2);margin-top:3px;}
  .greet-meta{font-size:12px;color:var(--text3);}

  /* checklist */
  .checklist{
    background:var(--panel);border:1px solid var(--primary-line);border-radius:var(--radius-lg);
    padding:16px 18px;margin-bottom:16px;position:relative;
  }
  .checklist.hidden{display:none;}
  .cl-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .cl-title{font-size:14px;font-weight:500;}
  .cl-count{font-size:12px;color:var(--primary);background:var(--primary-bg);padding:1px 8px;border-radius:9px;font-weight:500;}
  .cl-skip{margin-left:auto;font-size:12px;color:var(--text3);}
  .cl-skip:hover{color:var(--text2);}
  .cl-from{font-size:11px;color:var(--text3);margin-left:2px;}
  .bar{height:4px;background:#eef1f4;border-radius:2px;overflow:hidden;margin-bottom:12px;}
  .bar span{display:block;height:100%;background:var(--primary);border-radius:2px;transition:width .3s ease;width:0;}
  .cl-list{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;}
  .cl-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:6px;cursor:pointer;transition:.15s;}
  .cl-item:hover{background:#f7f9fb;}
  .cl-item.done{color:var(--text3);}
  .cl-item.done .cl-text{text-decoration:line-through;}
  .cl-box{
    width:15px;height:15px;flex:0 0 15px;border:1.5px solid var(--line-strong);border-radius:4px;
    display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;
  }
  .cl-item.done .cl-box{background:var(--ok);border-color:var(--ok);}
  .cl-text{font-size:13px;}
  .cl-step{margin-left:auto;font-size:11px;color:var(--text3);}

  /* kpi */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;}
  .kpi-label{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:5px;}
  .kpi-val{font-size:24px;font-weight:600;letter-spacing:-.5px;margin:4px 0 2px;font-variant-numeric:tabular-nums;}
  .kpi-unit{font-size:13px;font-weight:400;color:var(--text2);margin-left:2px;}
  .kpi-foot{font-size:11px;color:var(--text3);}
  .up{color:var(--ok);} .down{color:var(--danger);}

  /* two col */
  .cols{display:grid;grid-template-columns:1.55fr 1fr;gap:12px;align-items:start;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);}
  .card-hd{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);}
  .card-hd h3{font-size:13px;font-weight:500;}
  .card-hd .more{margin-left:auto;font-size:12px;color:var(--text3);}
  .card-hd .more:hover{color:var(--primary);}
  .card-bd{padding:6px 8px 10px;}

  .todo{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:6px;cursor:pointer;}
  .todo:hover{background:#f7f9fb;}
  .todo-ico{width:26px;height:26px;flex:0 0 26px;border-radius:6px;background:var(--primary-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;}
  .todo-ico.red{background:var(--danger-bg);color:var(--danger);}
  .todo-ico.warn{background:var(--warn-bg);color:var(--warn);}
  .todo-t{font-size:13px;}
  .todo-s{font-size:11px;color:var(--text3);}
  .todo-tag{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:9px;background:#f0f2f5;color:var(--text2);white-space:nowrap;}
  .todo-tag.red{background:var(--danger-bg);color:var(--danger);}
  .todo-tag.warn{background:var(--warn-bg);color:var(--warn);}

  .quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 12px 14px;}
  .q{
    border:1px solid var(--line);border-radius:var(--radius);padding:12px 10px;font-size:12px;
    display:flex;flex-direction:column;gap:7px;color:var(--text2);transition:.15s;text-align:left;
  }
  .q:hover{border-color:var(--primary-line);background:var(--primary-bg);color:var(--primary);}
  .q-ico{width:22px;height:22px;border-radius:6px;background:#eef1f4;display:flex;align-items:center;justify-content:center;}
  .q:hover .q-ico{background:#fff;}
  .q.hl{border-color:var(--primary-line);background:var(--primary-bg);color:var(--primary);font-weight:500;position:relative;}
  .q.hl .q-ico{background:#fff;}
  .q.hl::after{content:"新";position:absolute;top:-6px;right:-4px;background:var(--danger);color:#fff;font-size:10px;padding:0 5px;border-radius:8px;line-height:15px;}

  /* drawer */
  .mask{position:fixed;inset:0;background:rgba(20,30,45,.42);opacity:0;pointer-events:none;transition:.2s;z-index:20;}
  .mask.on{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;height:100vh;width:min(1120px,94vw);background:var(--panel);
    transform:translateX(100%);transition:transform .26s cubic-bezier(.3,.8,.3,1);z-index:21;
    display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(16,30,54,.14);
  }
  .drawer.on{transform:translateX(0);}
  .dr-hd{flex:0 0 auto;padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
  .dr-hd h2{font-size:15px;font-weight:600;}
  .dr-hd p{font-size:12px;color:var(--text3);}
  .dr-close{margin-left:auto;width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text3);}
  .dr-close:hover{background:#f0f2f5;color:var(--text);}
  .dr-body{flex:1;overflow-y:auto;padding:18px 22px 32px;background:#fafbfc;}

  .map-hint{
    display:flex;align-items:center;gap:8px;background:var(--primary-bg);border:1px solid var(--primary-line);
    border-radius:var(--radius);padding:9px 14px;font-size:12px;color:var(--primary);margin-bottom:16px;
  }
  .map-hint b{font-weight:500;}

  .lane{position:relative;margin-bottom:14px;}
  .lane-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .lane-hd .nm{font-size:12px;font-weight:500;color:var(--text2);}
  .lane-hd .mod{font-size:10px;color:var(--text3);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-family:ui-monospace,Consolas,monospace;}
  .lane-hd .bar-line{flex:1;height:1px;background:var(--line);}
  .lane-nodes{display:flex;gap:10px;flex-wrap:wrap;}

  .node{
    flex:1;min-width:126px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 12px;cursor:pointer;transition:.15s;position:relative;
  }
  .node:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(27,95,170,.1);transform:translateY(-1px);}
  .node-nm{font-size:13px;font-weight:500;margin-bottom:2px;}
  .node-ds{font-size:11px;color:var(--text3);}
  .node.hl{border-color:var(--primary);background:var(--primary-bg);}
  .node.hl .node-nm{color:var(--primary);}
  .node.dim{opacity:.44;}
  .node.lock{opacity:.55;background:#f7f8f9;}
  .node.lock::after{content:"未开通";position:absolute;top:8px;right:8px;font-size:10px;color:var(--text3);background:#eceff2;padding:0 5px;border-radius:4px;}
  .flow-arrow{display:flex;align-items:center;justify-content:center;color:var(--line-strong);font-size:14px;padding:2px 0 6px;}

  .toast{
    position:fixed;left:50%;bottom:74px;transform:translate(-50%,14px);background:#22303f;color:#fff;
    font-size:13px;padding:9px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.22s;z-index:40;
    box-shadow:0 6px 20px rgba(16,30,54,.22);max-width:88vw;
  }
  .toast.on{opacity:1;transform:translate(-50%,0);}

  .fade{animation:fade .25s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  @media(max-width:1080px){
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .cols{grid-template-columns:1fr;}
    .cl-list{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand"><span class="brand-mark">E</span>EDOP</div>
    <div class="crumb">首页 / <b>我的工作台</b></div>
    <div class="topbar-right">
      <button class="icon-btn" title="帮助中心">?</button>
      <button class="icon-btn" title="设置">
        <span style="width:14px;height:14px;border:1.5px solid currentColor;border-radius:50%;display:block;"></span>
      </button>
      <div class="user-chip">
        <span class="avatar" id="avText">王</span>
        <span style="display:flex;flex-direction:column;line-height:1.3;">
          <span class="user-name" id="userName">王采购</span>
          <span class="user-dept" id="userDept">采购部 · 主管</span>
        </span>
      </div>
    </div>
  </header>

  <div class="body">

    <aside class="sidebar" id="sidebar">
      <div class="nav-group">我的工作</div>
      <div class="nav-item on"><span class="nav-ico"></span><span class="nav-text">工作台</span></div>
      <div class="nav-item" id="navMap"><span class="nav-ico"></span><span class="nav-text">业务全景图</span></div>
      <div class="nav-group">采购管理</div>
      <div class="nav-item" data-tip="采购申请"><span class="nav-ico"></span><span class="nav-text">采购申请</span></div>
      <div class="nav-item" data-tip="采购订单"><span class="nav-ico"></span><span class="nav-text">采购订单</span><span class="nav-badge" id="navBadge">3</span></div>
      <div class="nav-item" data-tip="供应商管理"><span class="nav-ico"></span><span class="nav-text">供应商管理</span></div>
      <div class="nav-item" data-tip="询价比价"><span class="nav-ico"></span><span class="nav-text">询价比价</span></div>
      <div class="nav-more" id="navMore">展开全部 26 个菜单 ›</div>
    </aside>

    <main class="content">

      <div class="greet">
        <div>
          <h1 id="greetTitle">下午好，王采购</h1>
          <p id="greetSub">今天有 3 项待办、1 条逾期提醒需要处理</p>
        </div>
        <div class="greet-meta" id="greetMeta">采购部 · 主管</div>
      </div>

      <!-- 新手清单 -->
      <section class="checklist" id="checklist">
        <div class="cl-head">
          <span class="cl-title">新手上路</span>
          <span class="cl-count" id="clCount">0/5</span>
          <span class="cl-from" id="clFrom"></span>
          <button class="cl-skip" id="clSkip">稍后再说</button>
        </div>
        <div class="bar"><span id="clBar"></span></div>
        <div class="cl-list" id="clList"></div>
      </section>

      <!-- KPI -->
      <section class="kpi-grid" id="kpiGrid"></section>

      <div class="cols">
        <section class="card">
          <div class="card-hd"><h3>我的待办</h3><span class="more">全部 ›</span></div>
          <div class="card-bd" id="todoList"></div>
        </section>

        <section class="card">
          <div class="card-hd"><h3>常用功能</h3><span class="more">自定义 ›</span></div>
          <div class="quick" id="quickGrid"></div>
        </section>
      </div>

    </main>
  </div>
</div>

<div class="demo-bar">
  <span class="demo-tag">原型演示</span>
  <span class="demo-label">切换视角</span>
  <div class="role-switch" id="roleSwitch">
    <button data-role="buyer" class="on">采购主管</button>
    <button data-role="wh">仓库主管</button>
    <button data-role="boss">总经理</button>
  </div>
  <span class="demo-sep"></span>
  <button class="mode-btn" id="modeBtn"><span class="dot" id="modeDot"></span><span id="modeTxt">新用户模式</span></button>
</div>

<div class="mask" id="mask"></div>
<div class="drawer" id="drawer">
  <div class="dr-hd">
    <div>
      <h2>业务全景图</h2>
      <p>点任一节点可直接进入对应功能；灰色为当前角色无权限或未开通模块</p>
    </div>
    <button class="dr-close" id="drClose">×</button>
  </div>
  <div class="dr-body">
    <div class="map-hint" id="mapHint"></div>
    <div id="mapWrap"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

      {l:"库存预警", v:"5", u:"项", f:"低于安全库存，需补货", c:"down"},

    ],
    todos: [
      {i:"收", c:"warn", t:"6 张到货通知待收货", s:"A 区 2 单、B 区 4 单，需今日完成", g:"今天", gc:"warn"},
      {i:"警", c:"red", t:"5 个物料低于安全库存", s:"含 2 个生产急用料，已通知采购", g:"紧急", gc:"red"},
      {i:"盘", c:"", t:"月度盘点任务待提交", s:"抽盘完成 82%，剩余 A 区货架", g:"3 天", gc:""}
    ],
    quick: [
      {t:"收货入库", hl:false}, {t:"出库拣货", hl:false},
      {t:"库存台账", hl:false}, {t:"业务全景图", hl:true, map:true}
    ],
    tasks: [
      "建立库区与货位",
      "完成第一次收货上架",
      "设置安全库存预警线",
      "完成一次出库拣货",
      "提交一次盘点任务"
    ],
    from: "已按「仓库主管」岗位自动匹配 5 步主线",
    hl: ["wms","mk"]
  },
  boss: {
    name: "陈总", dept: "总经办 · 总经理",
    greet: "下午好，陈总",
    sub: "本月经营情况良好，2 项指标需关注",
    kpis: [
      {l:"本月采购额", v:"1,284", u:"万", f:"较上月 <span class='down'>-3.1%</span>", c:""},
      {l:"订单履约率", v:"96.1", u:"%", f:"目标 95%，<span class='up'>达标</span>", c:""},
      {l:"库存周转天数", v:"41", u:"天", f:"较上月 -2 天，持续改善", c:""},
      {l:"异常供应商", v:"3", u:"家", f:"逾期交付 2 家、质量 1 家", c:"down"}
    ],
    todos: [
      {i:"批", c:"", t:"5 张采购单待终审", s:"合计金额 ¥62.4 万，均超授权额度", g:"待审批", gc:""},
      {i:"报", c:"warn", t:"10 月经营分析报告待确认", s:"含采购、库存、履约三维度", g:"本周", gc:"warn"},
      {i:"警", c:"red", t:"3 家供应商交付异常", s:"TOP3 供应商履约率低于 90%", g:"关注", gc:"red"}
    ],
    quick: [
      {t:"经营看板", hl:false}, {t:"决策支持", hl:false},
      {t:"供应商画像", hl:false}, {t:"业务全景图", hl:true, map:true}
    ],
    tasks: [
      "查看本月经营总览与关键指标",
      "配置我关注的 5 个核心指标",
      "订阅每日经营简报",
      "设置异常指标的预警阈值"
    ],
    from: "已按「总经理」岗位自动匹配 4 步主线",
    hl: ["bi","mk","wms","dms"]
  }
};

const MAP = [
  {lane:"需求与订单", mod:"dms", nodes:[
    {id:"dms", nm:"销售订单", ds:"客户订单、交期"},
    {id:"dms2", nm:"客户管理", ds:"客户档案、信用"}
  ]},
  {lane:"采购供应", mod:"mk", nodes:[
    {id:"mk", nm:"采购申请", ds:"需求提报、审批"},
    {id:"mk2", nm:"采购订单", ds:"下单、跟单、对账"},
    {id:"mk3", nm:"供应商管理", ds:"准入、评级、资质"}
  ]},
  {lane:"仓储物流", mod:"wms", nodes:[
    {id:"wms", nm:"收货入库", ds:"到货、质检、上架"},
    {id:"wms2", nm:"库存管理", ds:"台账、预警、盘点"},
    {id:"wms3", nm:"出库发运", ds:"拣货、复核、发运"}
  ]},
  {lane:"生产与委外", mod:"pms", nodes:[
    {id:"pms", nm:"生产工单", ds:"排产、报工"},
    {id:"pms2", nm:"委外加工", ds:"委外发出、回厂"}
  ]},
  {lane:"经营决策", mod:"bi", nodes:[
    {id:"bi", nm:"经营看板", ds:"采购/库存/履约"},
    {id:"bi2", nm:"决策支持", ds:"指标、快照、预警"}
  ]}
];

let state = { role:"buyer", newbie:true, done:{} };

const $ = id => document.getElementById(id);
const toast = (msg) => {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("on"), 2200);
};

function render(){
  const r = ROLES[state.role];

  $("greetTitle").textContent = r.greet;
  $("greetSub").textContent = r.sub;
  $("greetMeta").textContent = r.dept;
  $("avText").textContent = r.name.slice(0,1);
  $("userName").textContent = r.name;
  $("userDept").textContent = r.dept;

  // KPI
  $("kpiGrid").innerHTML = r.kpis.map(k => `
    <div class="kpi fade">
      <div class="kpi-label">${k.l}</div>
      <div class="kpi-val">${k.v}<span class="kpi-unit">${k.u}</span></div>
      <div class="kpi-foot ${k.c}">${k.f}</div>
    </div>`).join("");

  // 待办
  $("todoList").innerHTML = r.todos.map(t => `
    <div class="todo">
      <div class="todo-ico ${t.c}">${t.i}</div>
      <div>
        <div class="todo-t">${t.t}</div>
        <div class="todo-s">${t.s}</div>
      </div>
      <span class="todo-tag ${t.gc}">${t.g}</span>
    </div>`).join("");

  // 快捷入口
  $("quickGrid").innerHTML = r.quick.map((q,i) => `
    <button class="q ${q.hl && state.newbie ? "hl" : ""}" data-q="${i}">
      <span class="q-ico"></span>${q.t}
    </button>`).join("");

  $("quickGrid").querySelectorAll("[data-q]").forEach(b => {
    b.onclick = () => {
      const q = r.quick[+b.dataset.q];
      if(q.map){ openDrawer(); }
      else toast(`跳转到「${q.t}」页面`);
    };
  });

  // 新手清单
  $("checklist").classList.toggle("hidden", !state.newbie);
  $("clFrom").textContent = r.from;
  const doneCount = r.tasks.filter((_,i) => state.done[state.role + i]).length;
  $("clCount").textContent = `${doneCount}/${r.tasks.length}`;
  $("clBar").style.width = (doneCount / r.tasks.length * 100) + "%";
  $("clList").innerHTML = r.tasks.map((t,i) => `
    <div class="cl-item ${state.done[state.role + i] ? "done" : ""}" data-cl="${i}">
      <span class="cl-box">${state.done[state.role + i] ? "✓" : ""}</span>
      <span class="cl-text">${t}</span>
      <span class="cl-step">第 ${i+1} 步</span>
    </div>`).join("");

  $("clList").querySelectorAll("[data-cl]").forEach(el => {
    el.onclick = () => {
      const i = el.dataset.cl;
      state.done[state.role + i] = !state.done[state.role + i];
      render();
      const n = ROLES[state.role].tasks.filter((_,k) => state.done[state.role + k]).length;
      if(n === ROLES[state.role].tasks.length) {
        toast("全部完成，你已经掌握核心流程了。可以切换到日常模式了");
      }
    };
  });

  // 全景图高亮
  const roleHl = r.hl;
  $("mapHint").innerHTML = `<b>当前按「${r.dept.split("·")[1].trim()}」视角高亮</b>：${roleHl.map(x=>MAP.find(m=>m.nodes.some(n=>n.id===x))?.lane || x).filter((v,i,a)=>a.indexOf(v)===i).join(" → ")}；其他模块已淡化`;
  $("mapWrap").innerHTML = MAP.map((lane, li) => `
    <div class="lane">
      <div class="lane-hd"><span class="nm">${lane.lane}</span><span class="mod">${lane.mod}</span><span class="bar-line"></span></div>
      <div class="lane-nodes">
        ${lane.nodes.map(n => {
          const on = roleHl.includes(n.id);
          return `<div class="node ${on ? "hl" : "dim"}" data-node="${n.nm}">
            <div class="node-nm">${n.nm}</div><div class="node-ds">${n.ds}</div>
          </div>`;
        }).join("")}
      </div>
      ${li < MAP.length - 1 ? '<div class="flow-arrow">↓</div>' : ''}
    </div>`).join("");

  $("mapWrap").querySelectorAll("[data-node]").forEach(el => {
    el.onclick = () => {
      toast(`进入「${el.dataset.node}」功能页`);
      closeDrawer();
    };
  });
}

function openDrawer(){ $("mask").classList.add("on"); $("drawer").classList.add("on"); }
function closeDrawer(){ $("mask").classList.remove("on"); $("drawer").classList.remove("on"); }

$("mask").onclick = closeDrawer;
$("drClose").onclick = closeDrawer;
$("navMap").onclick = openDrawer;
document.addEventListener("keydown", e => { if(e.key === "Escape") closeDrawer(); });

$("roleSwitch").addEventListener("click", e => {
  const b = e.target.closest("button[data-role]");
  if(!b) return;
  $("roleSwitch").querySelectorAll("button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  state.role = b.dataset.role;
  render();
  toast(`已切换为「${ROLES[state.role].dept.split("·")[1].trim()}」视角`);
});

$("modeBtn").onclick = () => {
  state.newbie = !state.newbie;
  $("modeTxt").textContent = state.newbie ? "新用户模式" : "日常模式";
  $("modeDot").classList.toggle("gray", !state.newbie);
  render();
  toast(state.newbie ? "新用户模式：显示新手清单与全景图入口" : "日常模式：仅保留待办与常用功能");
};

$("clSkip").onclick = () => { state.newbie = false; $("modeTxt").textContent = "日常模式"; $("modeDot").classList.add("gray"); render(); toast("已收起新手清单，可随时在帮助中心找回"); };
$("navMore").onclick = () => toast("展开后是完整的 26 个菜单 —— 这正是用户记不住的根源");
document.querySelectorAll(".nav-item[data-tip]").forEach(el => {
  el.onclick = () => toast(`跳转到「${el.dataset.tip}」`);
});

render();

setTimeout(() => toast("底部「原型演示」条仅用于切换视角，真实系统里角色由登录账号决定，用户看不到切换器"), 700);
</script>
</body>
</html>
