<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDOP 智能助手 · 连接器授权</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.08); padding: 36px; width: 420px; }
  h1 { font-size: 20px; color: #1f2d3d; text-align: center; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #8492a6; text-align: center; margin-bottom: 28px; }
  label { display: block; font-size: 13px; color: #475669; margin: 14px 0 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #d3dce6; border-radius: 6px; font-size: 14px; outline: none; }
  input:focus { border-color: #409eff; }
  button { width: 100%; margin-top: 24px; padding: 11px; background: #1890ff; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:disabled { background: #a0cfff; }
  .msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
  .msg.err { color: #f56c6c; }
  .msg.ok { color: #67c23a; }
  .token-box { margin-top: 16px; display: none; }
  .token-box textarea { width: 100%; height: 72px; padding: 10px; border: 1px solid #d3dce6; border-radius: 6px; font-size: 12px; font-family: monospace; resize: none; background: #f8fafc; }
  .hint { font-size: 12px; color: #8492a6; line-height: 1.8; margin-top: 14px; }
  .hint b { color: #e6a23c; }
  .expire { font-size: 12px; color: #67c23a; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>EDOP 智能助手 · 连接器授权</h1>
  <div class="sub">使用你的 EDOP 账号登录，为 WorkBuddy 智能助手颁发专属授权</div>
  <form id="f" onsubmit="return submitForm(event)">
    <label>EDOP 用户名</label>
    <input id="username" required autocomplete="username" placeholder="与登录 EDOP 平台相同">
    <label>密码</label>
    <input id="password" type="password" required autocomplete="current-password" placeholder="平台登录密码">
    <label>授权来源备注（可选）</label>
    <input id="clientDesc" placeholder="如：WorkBuddy-张三电脑">
    <button id="btn" type="submit">授权</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="token-box" id="tokenBox">
    <label>你的授权 Token（<b>仅显示这一次</b>，请立即复制）</label>
    <textarea id="tokenOut" readonly onclick="this.select()"></textarea>
    <div class="expire" id="expireOut"></div>
    <div class="hint">
      使用方法：WorkBuddy → 连接器 → 自定义连接器 → 配置 MCP，headers 中填<br>
      <b>Authorization: Bearer 你的token</b><br>
      Token 长期有效（90 天滚动续期），泄露可随时在「连接器授权」页吊销重新授权。
    </div>
  </div>
</div>
<script>
async function submitForm(e) {
  e.preventDefault();
  const msg = document.getElementById('msg'), btn = document.getElementById('btn');
  msg.className = 'msg'; msg.textContent = '授权中...';
  btn.disabled = true;
  try {
    const res = await fetch('/edop/connector/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
        clientDesc: document.getElementById('clientDesc').value.trim() || 'WorkBuddy'
      })
    });
    const data = await res.json();
    if (data.code === 200 && data.grantToken) {
      msg.className = 'msg ok'; msg.textContent = '授权成功！';
      document.getElementById('tokenBox').style.display = 'block';
      document.getElementById('tokenOut').value = data.grantToken;
      document.getElementById('expireOut').textContent = '有效期至：' + (data.expireTime || '90 天后');
      document.getElementById('f').reset();
    } else {
      msg.className = 'msg err'; msg.textContent = data.msg || ('失败 (code=' + data.code + ')');
    }
  } catch (err) {
    msg.className = 'msg err'; msg.textContent = '网络错误：' + err.message;
  }
  btn.disabled = false;
  return false;
}
</script>
</body>
</html>
