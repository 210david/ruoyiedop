spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # ========== 主库数据源 ==========
            # 请修改为实际的数据库地址、端口、库名、用户名、密码
            master:
                url: jdbc:mysql://localhost:3306/RUOYI_CFSP?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
                username: root
                # Druid 加密密码（明文 ZBrj@2026；更换方式: java -cp druid-1.2.28.jar com.alibaba.druid.filter.config.ConfigTools 新密码）
                password: fBCDoozBjsSnNKAVF5kdOPGdIVn23UESJuY4uFsiiP5ETlKHBaxTC6itcV3Vjo9BRToDYfHFGp7KFwvZE1n2kw==
            # 从库数据源（默认关闭）
            slave:
                enabled: false
                url:
                username:
                password:
            # 连接池配置
            initialSize: 3
            minIdle: 3
            maxActive: 10
            maxWait: 30000
            connectTimeout: 30000
            socketTimeout: 60000
            timeBetweenEvictionRunsMillis: 60000
            minEvictableIdleTimeMillis: 300000
            maxEvictableIdleTimeMillis: 900000
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter:
                enabled: true
            statViewServlet:
                enabled: true
                allow:
                url-pattern: /druid/*
                # Druid监控台账号密码（生产环境请修改）
                login-username: ruoyi
                # Druid 控制台独立密码（与数据库密码不同，控制台不支持加密存储）
                login-password: RSFC8cfmnmfdI5i42nkn
            filter:
                stat:
                    enabled: true
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true
