            # 从库数据源
            slave:
                enabled: false
                url:
                username:
                password:
            initialSize: 3
            minIdle: 3
            maxActive: 10
            maxWait: 30000
            connectTimeout: 30000
            socketTimeout: 60000
            timeBetweenEvictionRunsMillis: 60000
            minEvictableIdleTimeMillis: 300000
