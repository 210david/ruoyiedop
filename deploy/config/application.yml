# 项目相关配置（YLSP 生产环境 - 外部覆盖配置）
ruoyi:
  name: RuoYi
  version: 3.9.2
  copyrightYear: 2026
  # 文件上传根目录（本业务目录内，互不干扰）
  profile: D:/EDOP/YLSP/uploadPath
  addressEnabled: false
  captchaType: math
  fileEncryptionKey: EDOP2026SecureK3y!

# 服务端口：YLSP 后端 82
server:
  port: 82
  address: 127.0.0.1
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: info
    org.springframework: warn
  file:
    name: logs/ruoyi.log

# 用户配置
user:
  password:
    maxRetryCount: 5
    lockTime: 30
    onlineCount: 5
    onlineMode: kick
    passwordExpireDays: 90

# Spring配置
spring:
  messages:
    basename: i18n/messages
  profiles:
    active: druid
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  devtools:
    restart:
      # 生产环境必须关闭热部署
      enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      # YLSP 环境使用 db1（CFSP 使用 db0，共用实例互不干扰）
      database: 1
      # Redis 密码（与 redis.windows.conf 的 requirepass 一致）
      password: 
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms

# token配置
token:
  header: Authorization
  # JWT 签名密钥（随机生成，泄露或更换会使所有登录态失效）
  secret: V-DJVozmaNXl31x_6uC1pGqKJT2uLTX8csP4RQXj1rwXNqIc-l55gNceKRBIrxzT
  expireTime: 120

# MyBatis配置
mybatis:
  typeAliasesPackage: com.ruoyi.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1

# 防止XSS攻击
xss:
  enabled: true
  excludes: /system/notice,/mk/invoice/recognize
  urlPatterns: /system/*,/monitor/*,/tool/*,/wms/*,/dms/*,/mk/*,/pms/*,/safety/*,/mms/*,/hr/*,/qms/*

# 采购管理模块配置
pms:
  enterprise-lookup:
    mode: simulation
    api-url: https://api.tianyancha.com/cloud-originapi/companyinfo
    api-key:
