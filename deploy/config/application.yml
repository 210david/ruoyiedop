# ============================================================
# 传丰食品数字化运营平台 - 生产环境配置
# 部署路径: D:\EDOP_CFSP\app\application.yml
# 说明: 此文件会覆盖jar包内部同名配置，修改后重启服务即可生效
# ============================================================

# 项目相关配置
ruoyi:
  name: RuoYi
  version: 3.9.2
  copyrightYear: 2026
  # 文件上传根目录（优先级：环境变量 EDOP_UPLOAD_PATH > 本文件 > 默认 ${user.dir}/uploadPath）
  # 生产环境实际使用 D:/EDOP/uploadPath；如需改名/迁移，改此处或设环境变量 EDOP_UPLOAD_PATH 即可
  profile: D:/EDOP_CFSP/uploadPath
  addressEnabled: false
  captchaType: math
  # 文件加密密钥（AES-128，需至少16位字符，生产环境请务必修改）
  fileEncryptionKey: EDOP2026SecureK3y!

# 开发环境配置
server:
  port: 8082
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: info
    org.springframework: warn
  file:
    name: D:/EDOP_CFSP/app/logs/ruoyi.log

# 用户配置
user:
  password:
    maxRetryCount: 5
    lockTime: 30
    onlineCount: 1
    onlineMode: kick
    passwordExpireDays: 90

# Spring配置
spring:
  messages:
    basename: i18n/messages
  profiles:
    active: druid
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 生产环境关闭热部署
  devtools:
    restart:
      enabled: false
  data:
    redis:
      # Redis地址（本机部署用localhost，远程部署改为实际IP）
      host: localhost
      port: 6379
      database: 1
      # Redis密码（与 deploy/config/redis.windows.conf 的 requirepass 一致，务必保持同步）
      password: cc99de507fc3934eb8f84b5c4f76e11d
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms

# token配置
token:
  header: Authorization
  # 令牌密钥（随机生成，严禁改回默认值；泄露或更换会使所有登录态失效）
  secret: 2DOVQuux9LM6r3euwcG6Zzp89nR778hYNIQuOd0n26sn8HkZDeJ0d/XSXvuRCDHC
  expireTime: 30

# MyBatis配置
mybatis:
  typeAliasesPackage: com.ruoyi.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # 生产环境可设为false关闭Swagger
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1

# 防止XSS攻击
xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*,/wms/*,/dms/*,/mk/*
